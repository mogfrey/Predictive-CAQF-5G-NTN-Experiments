[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-caqf-ntn-experiments"
version = "0.1.0"
description = "Reproducible experiment framework for predictive CA-QF over 5G Release-17 NTN"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
caqf-exp = "caqf_exp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
